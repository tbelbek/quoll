name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      # secrets cannot be tested in a step `if:` directly
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import Developer ID certificate (optional)
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          echo "QUOLL_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials quoll-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "QUOLL_NOTARY_PROFILE=quoll-notary" >> "$GITHUB_ENV"
      - name: Check version matches tag
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build release
        run: ./scripts/release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Quoll $GITHUB_REF_NAME" --generate-notes
      - name: Update Homebrew tap (optional)
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="$(cat VERSION)"
          SHA="$(cut -d' ' -f1 dist/*.sha256)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tbelbek/homebrew-quoll.git" "$RUNNER_TEMP/tap"
          ./scripts/update-cask.sh "$VERSION" "$SHA" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "quoll-release"
          git config user.email "quoll-release@users.noreply.github.com"
          git commit -am "quoll $VERSION" && git push
